<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OfficeHours — Lecturer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>OfficeHours</h1>
    <p>Lecturer dashboard</p>
  </header>

  <main>
    <form id="loginForm" class="login-form">
  <label for="lecturerName">Staff email</label>
  <input type="email" id="lecturerName" placeholder="you@ump.ac.za" autocomplete="off" required>

  <label for="lecturerPassword">Password</label>
  <input type="password" id="lecturerPassword" placeholder="Password" required>

  <button type="submit">Sign in</button>
  <p><a href="#" id="showRegister">New here? Register</a></p>
</form>

<form id="registerForm" class="login-form hidden">
  <label for="regName">Full name</label>
  <input type="text" id="regName" placeholder="Dr. Jane Sithole" required>

  <label for="regEmail">Staff email</label>
  <input type="email" id="regEmail" placeholder="you@ump.ac.za" required>

  <label for="regPassword">Password</label>
  <input type="password" id="regPassword" placeholder="Choose a password" required>

  <button type="submit">Create account</button>
  <p><a href="#" id="showLogin">Already have an account? Sign in</a></p>
</form>

    <div id="dashboard" class="dashboard hidden">
      <p id="welcomeMsg"></p>
      <form id="createSlotsForm" class="create-slots-form">
  <label for="slotDay">Day</label>
  <select id="slotDay">
    <option>Mon</option>
    <option>Tue</option>
    <option>Wed</option>
    <option>Thu</option>
    <option>Fri</option>
  </select>

  <label for="slotStart">Start time</label>
  <input type="time" id="slotStart" required>

  <label for="slotEnd">End time</label>
  <input type="time" id="slotEnd" required>

  <label for="slotDuration">Slot length (minutes)</label>
  <input type="number" id="slotDuration" value="15" min="5" required>

  <button type="submit">Create slots</button>
</form>

<div id="slotGrid" class="slot-grid"></div>
    </div>
    <h3>Upcoming bookings</h3>
<div id="bookingsList"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
