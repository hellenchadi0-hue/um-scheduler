<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OfficeHours — Student</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>OfficeHours</h1>
    <p>Student booking</p>
  </header>

  <main>
    <form id="studentLoginForm" class="login-form">
      <label for="studentNumber">Student number</label>
      <input type="text" id="studentNumber" placeholder="20231234" required>

      <label for="studentPassword">Password</label>
      <input type="password" id="studentPassword" placeholder="Password" required>

      <button type="submit">Sign in</button>
      <p><a href="#" id="showStudentRegister">New here? Register</a></p>
    </form>

    <form id="studentRegisterForm" class="login-form hidden">
      <label for="regStudentName">Full name</label>
      <input type="text" id="regStudentName" placeholder="Thabo Mahlangu" required>

      <label for="regStudentNumber">Student number</label>
      <input type="text" id="regStudentNumber" placeholder="20231234" required>

      <label for="regStudentEmail">Student email</label>
      <input type="email" id="regStudentEmail" placeholder="you@ump.ac.za" required>

      <label for="regStudentPassword">Password</label>
      <input type="password" id="regStudentPassword" placeholder="Choose a password" required>

      <button type="submit">Create account</button>
      <p><a href="#" id="showStudentLogin">Already have an account? Sign in</a></p>
    </form>

    <div id="studentDashboard" class="dashboard hidden">
      <p id="studentWelcomeMsg"></p>

      <label for="lecturerPicker">Choose a lecturer</label>
      <select id="lecturerPicker">
        <option value="">-- Select a lecturer --</option>
      </select>

      <div id="studentSlotGrid" class="slot-grid"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
