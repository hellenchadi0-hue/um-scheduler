<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OfficeHours — Student</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>OfficeHours</h1>
    <p>Book a private meeting with your lecturer</p>
    <nav><a href="index.html">Home</a> · <a href="lecturer.html">Lecturer</a></nav>
  </header>

  <main>
    <form id="studentLoginForm" class="card login-form">
      <label for="loginNumber">Student number</label>
      <input type="text" id="loginNumber" inputmode="numeric" autocomplete="off" required>

      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" required>

      <button type="submit">Sign in</button>
      <p class="msg" id="studentLoginMsg" role="alert"></p>
      <p><a href="#" id="showStudentRegister">New here? Register</a></p>
    </form>

    <form id="studentRegisterForm" class="card login-form hidden">
      <label for="regStuName">Full name</label>
      <input type="text" id="regStuName" required>

      <label for="regStuNumber">Student number</label>
      <input type="text" id="regStuNumber" inputmode="numeric" required>

      <label for="regStuEmail">Email</label>
      <input type="email" id="regStuEmail" required>

      <label for="regStuPassword">Password</label>
      <input type="password" id="regStuPassword" minlength="8" placeholder="Min 8 characters" required>

      <button type="submit">Create account</button>
      <p class="msg" id="studentRegisterMsg" role="alert"></p>
      <p><a href="#" id="showStudentLogin">Already have an account? Sign in</a></p>
    </form>

    <div id="studentDashboard" class="dashboard hidden">
      <div class="welcome-row">
        <p id="studentWelcome"></p>
        <button type="button" id="studentLogout" class="secondary">Sign out</button>
      </div>

      <section class="card">
        <h2>Book a meeting</h2>
        <label for="lecturerSelect">Lecturer</label>
        <select id="lecturerSelect"></select>
        <p class="hint" id="noLecturers"></p>
        <p class="hint">Click a green time to book it.</p>
        <div id="studentSlots" class="slot-grid"></div>
        <p class="msg" id="bookMsg" role="alert"></p>
      </section>

      <section class="card">
        <h2>My bookings</h2>
        <div id="myBookings"></div>
      </section>
    </div>
  </main>

  <script src="student.js"></script>
</body>
</html>
